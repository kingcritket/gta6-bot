<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Port Vela — game crime open-world di browser: curi mobil, kabur dari polisi, dan selesaikan lima misi Rook & Mara.">
<link rel="icon" href="data:,">
<title>Port Vela — Open-World Crime</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0d12; font-family: 'Segoe UI', system-ui, sans-serif; color: #f2f2f2; }
  #game { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  .panel { position: absolute; background: rgba(8, 12, 18, 0.72); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; padding: 10px 14px; }
  #cash-box { top: 14px; left: 14px; }
  #cash { font-size: 26px; font-weight: 800; color: #7ee787; letter-spacing: 0.5px; }
  #mission-box { top: 14px; left: 50%; transform: translateX(-50%); text-align: center; max-width: 46vw; }
  #mission { font-size: 15px; font-weight: 700; }
  #objective { font-size: 13px; opacity: 0.9; margin-top: 2px; }
  #stats-box { top: 14px; right: 14px; text-align: right; }
  #stars { font-size: 20px; letter-spacing: 3px; }
  #wanted-note { font-size: 12px; font-weight: 700; margin-top: 4px; display: none; }
  #health-bar { width: 150px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 6px; }
  #health-fill { height: 100%; width: 100%; background: #2ecc71; }
  #health-text { font-size: 12px; opacity: 0.9; }
  #ammo { font-size: 20px; font-weight: 700; margin-top: 4px; }
  #prompt { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: 600; background: rgba(8,12,18,0.75); padding: 8px 16px; border-radius: 8px; }
  #message { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); font-size: 15px; background: rgba(8,12,18,0.75); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity 0.3s; }
  #minimap { position: absolute; right: 14px; bottom: 14px; width: 180px; height: 180px; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; background: #20242a; }
  #speed { position: absolute; left: 14px; bottom: 40px; font-size: 26px; font-weight: 800; color: #f2f2f2; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  #status { position: absolute; left: 14px; bottom: 14px; font-size: 12px; opacity: 0.65; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8, 10, 14, 0.82); text-align: center; padding: 20px; z-index: 10; }
  #overlay-title { font-size: 54px; font-weight: 900; letter-spacing: 6px; margin: 0 0 12px; color: #ffd94d; text-shadow: 0 3px 18px rgba(0,0,0,0.7); }
  #overlay-lines p { font-size: 16px; line-height: 1.55; max-width: 620px; margin: 6px auto; opacity: 0.92; }
  #overlay-buttons { margin-top: 22px; display: flex; gap: 12px; }
  #overlay-buttons button { pointer-events: auto; font-size: 17px; font-weight: 700; padding: 12px 26px; border-radius: 9px; border: none; background: #ffd94d; color: #191410; cursor: pointer; }
  #overlay-buttons button:hover { background: #ffe27a; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="panel" id="cash-box"><div id="cash">$0</div></div>
  <div class="panel" id="mission-box"><div id="mission">Port Vela</div><div id="objective"></div></div>
  <div class="panel" id="stats-box">
    <div id="stars">☆☆☆☆☆</div>
    <div id="wanted-note"></div>
    <div id="health-bar"><div id="health-fill"></div></div>
    <div id="health-text">100</div>
    <div id="ammo">12 / 12</div>
  </div>
  <div id="prompt"></div>
  <div id="message"></div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="speed"></div>
  <div id="status"></div>
</div>
<div id="overlay">
  <h1 id="overlay-title">PORT VELA</h1>
  <div id="overlay-lines"></div>
  <div id="overlay-buttons"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
