<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<meta name="description" content="Port Vela — open-world crime game: steal cars, dodge the police, finish five missions.">
<title>Port Vela — Open-World Crime</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11141b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #eef1f5; display: none; }
  .panel { background: rgba(12, 16, 22, 0.72); border-radius: 10px; padding: 10px 14px; }
  #hud-tl { position: absolute; top: 14px; left: 14px; }
  #cash { font-size: 26px; font-weight: 700; color: #7ee787; }
  #mission { font-size: 15px; font-weight: 600; margin-top: 2px; }
  #objective { font-size: 13px; color: #c8cfd8; max-width: 340px; }
  #hud-tr { position: absolute; top: 14px; right: 14px; text-align: right; }
  #stars { font-size: 26px; letter-spacing: 3px; color: #5a636e; }
  #stars.hot { color: #ffd23f; text-shadow: 0 0 12px rgba(255, 210, 63, 0.8); }
  #hud-bl { position: absolute; bottom: 14px; left: 14px; }
  #health-bar { width: 200px; height: 14px; background: #2a3040; border-radius: 7px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: #2f9e44; transition: width 0.2s; }
  #health-fill.low { background: #e5534b; }
  #health-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 14px; }
  #controls { font-size: 12px; color: #9aa3ad; margin-top: 6px; }
  #ammo { font-size: 16px; font-weight: 600; }
  #hud-br { position: absolute; bottom: 14px; right: 14px; }
  #minimap { width: 180px; height: 180px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.25); background: #20242a; }
  #prompt { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 600; background: rgba(12,16,22,0.8); padding: 8px 16px; border-radius: 8px; display: none; }
  #message { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); font-size: 15px; background: rgba(12,16,22,0.8); padding: 8px 16px; border-radius: 8px; display: none; max-width: 80%; text-align: center; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 10, 14, 0.82); z-index: 10; }
  #overlay-card { max-width: 620px; width: calc(100% - 40px); background: #1a1f28; border: 1px solid #2c3442; border-radius: 16px; padding: 32px 36px; color: #eef1f5; text-align: center; }
  #overlay-title { font-size: 44px; font-weight: 800; letter-spacing: 4px; margin: 0 0 8px; color: #ffd23f; }
  #overlay-lines p { font-size: 15px; line-height: 1.55; color: #c8cfd8; margin: 10px 0; }
  #overlay-buttons { margin-top: 22px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  #overlay-buttons button { font-size: 17px; font-weight: 700; padding: 12px 26px; border-radius: 10px; border: none; background: #ffd23f; color: #14181f; cursor: pointer; }
  #overlay-buttons button:hover { background: #ffe06e; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="Port Vela: open-world crime game — explore the city on foot or by car, complete missions, evade the police"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud">
  <div id="hud-tl" class="panel">
    <div id="cash">$0</div>
    <div id="mission">Misi 1/5</div>
    <div id="objective"></div>
  </div>
  <div id="hud-tr" class="panel"><div id="stars">☆☆☆☆☆</div></div>
  <div id="hud-bl" class="panel">
    <div id="health-bar"><div id="health-fill"></div></div>
    <div id="health-row"><span>❤ <span id="health-text">100</span></span><span id="ammo">12 / ∞</span></div>
    <div id="controls">WASD jalan / setir · E curi mobil · F tembak · R reload · Shift lari · P jeda</div>
  </div>
  <div id="hud-br"><canvas id="minimap" width="180" height="180"></canvas></div>
  <div id="prompt"></div>
  <div id="message"></div>
</div>
<div id="overlay">
  <div id="overlay-card">
    <h1 id="overlay-title">PORT VELA</h1>
    <div id="overlay-lines"></div>
    <div id="overlay-buttons"></div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
